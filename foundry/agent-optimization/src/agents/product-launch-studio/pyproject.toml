[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "product-launch-studio"
version = "0.1.0"
description = "Evidence-grounded Microsoft Foundry hosted-agent workshop app"
requires-python = ">=3.10"
dependencies = [
  "agent-framework",
  "agent-framework-foundry",
  "agent-framework-foundry-hosting>=1.0.0b260813",
  "azure-ai-agentserver-core",
  "azure-ai-agentserver-optimization",
  "azure-identity",
  "azure-monitor-opentelemetry",
  "openai",
  "opentelemetry-api",
  "python-dotenv",
  "pydantic",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["product_launch_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
