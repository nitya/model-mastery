<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Product Launch Studio agent architecture</title>
  <desc id="desc">Eight-step flow with four steps across the top row, a turn, and four steps back across the bottom row.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172554" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .guard { stroke: #d97706; }
      .result { fill: #ecfdf5; stroke: #059669; }
      .step { fill: #1d4ed8; font: 700 15px Arial, sans-serif; letter-spacing: .4px; }
      .name { fill: #0f172a; font: 700 20px Arial, sans-serif; }
      .detail { fill: #475569; font: 15px Arial, sans-serif; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .turn-label { fill: #475569; font: 700 14px Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="410" rx="24" fill="url(#background)"/>

  <rect class="box" x="35" y="45" width="240" height="105"/>
  <text class="step" x="55" y="72">STEP 1</text>
  <text class="name" x="55" y="103">Brief + image</text>
  <text class="detail" x="55" y="128">Our source material</text>

  <rect class="box" x="330" y="45" width="240" height="105"/>
  <text class="step" x="350" y="72">STEP 2</text>
  <text class="name" x="350" y="103">Coordinator</text>
  <text class="detail" x="350" y="128">Frames the request</text>

  <rect class="box" x="625" y="45" width="240" height="105"/>
  <text class="step" x="645" y="72">STEP 3</text>
  <text class="name" x="645" y="103">Product analyst</text>
  <text class="detail" x="645" y="128">Finds approved evidence</text>

  <rect class="box" x="920" y="45" width="240" height="105"/>
  <text class="step" x="940" y="72">STEP 4</text>
  <text class="name" x="940" y="103">Strategist</text>
  <text class="detail" x="940" y="128">Chooses positioning</text>

  <path class="arrow" d="M275 98 H325"/>
  <path class="arrow" d="M570 98 H620"/>
  <path class="arrow" d="M865 98 H915"/>

  <path class="arrow" d="M1160 98 C1190 98 1190 312 1160 312"/>
  <text class="turn-label" x="1092" y="211">THEN</text>

  <rect class="box" x="920" y="260" width="240" height="105"/>
  <text class="step" x="940" y="287">STEP 5</text>
  <text class="name" x="940" y="318">Copywriter</text>
  <text class="detail" x="940" y="343">Writes channel copy</text>

  <rect class="box guard" x="625" y="260" width="240" height="105"/>
  <text class="step" x="645" y="287">STEP 6</text>
  <text class="name" x="645" y="318">Claim guard</text>
  <text class="detail" x="645" y="343">Checks every claim</text>

  <rect class="box" x="330" y="260" width="240" height="105"/>
  <text class="step" x="350" y="287">STEP 7</text>
  <text class="name" x="350" y="318">Image tool</text>
  <text class="detail" x="350" y="343">Creates the visual</text>

  <rect class="box result" x="35" y="260" width="240" height="105"/>
  <text class="step" x="55" y="287">STEP 8</text>
  <text class="name" x="55" y="318">Launch kit</text>
  <text class="detail" x="55" y="343">Ready for review</text>

  <path class="arrow" d="M920 312 H870"/>
  <path class="arrow" d="M625 312 H575"/>
  <path class="arrow" d="M330 312 H280"/>
</svg>
