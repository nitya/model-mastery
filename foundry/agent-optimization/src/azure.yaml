# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: agent-optimization-workshop

infra:
  provider: bicep
  path: ./infra

requiredVersions:
  azd: ">=1.20.0"
  extensions:
    azure.ai.agents: ">=0.1.0-preview"

services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: campaign-coordinator
        model:
          format: ${CAMPAIGN_COORDINATOR_MODEL_FORMAT}
          name: ${CAMPAIGN_COORDINATOR_MODEL_NAME}
          version: ${CAMPAIGN_COORDINATOR_MODEL_VERSION}
        sku:
          name: ${CAMPAIGN_COORDINATOR_MODEL_SKU}
          capacity: 10
      - name: visual-understanding
        model:
          format: ${VISUAL_UNDERSTANDING_MODEL_FORMAT}
          name: ${VISUAL_UNDERSTANDING_MODEL_NAME}
          version: ${VISUAL_UNDERSTANDING_MODEL_VERSION}
        sku:
          name: ${VISUAL_UNDERSTANDING_MODEL_SKU}
          capacity: 10
      - name: campaign-reasoning
        model:
          format: ${CAMPAIGN_REASONING_MODEL_FORMAT}
          name: ${CAMPAIGN_REASONING_MODEL_NAME}
          version: ${CAMPAIGN_REASONING_MODEL_VERSION}
        sku:
          name: ${CAMPAIGN_REASONING_MODEL_SKU}
          capacity: 10
      - name: adaptive-copy
        model:
          format: ${ADAPTIVE_COPY_MODEL_FORMAT}
          name: ${ADAPTIVE_COPY_MODEL_NAME}
          version: ${ADAPTIVE_COPY_MODEL_VERSION}
        sku:
          name: ${ADAPTIVE_COPY_MODEL_SKU}
          capacity: 10
      - name: creative-image
        model:
          format: ${CREATIVE_IMAGE_MODEL_FORMAT}
          name: ${CREATIVE_IMAGE_MODEL_NAME}
          version: ${CREATIVE_IMAGE_MODEL_VERSION}
        sku:
          name: ${CREATIVE_IMAGE_MODEL_SKU}
          capacity: 1

  product-launch-studio:
    project: ./agents/product-launch-studio
    host: azure.ai.agent
    language: python
    kind: hosted
    name: product-launch-studio
    description: Coordinates evidence-constrained product launch campaigns and selects purpose-fit models.
    uses:
      - ai-project
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    container:
      resources:
        cpu: "1"
        memory: 2Gi
    environmentVariables:
      - name: APP_MODE
        value: hosted
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: campaign-coordinator
      - name: COORDINATOR_MODEL_DEPLOYMENT_NAME
        value: campaign-coordinator
      - name: PRODUCT_ANALYST_MODEL_DEPLOYMENT_NAME
        value: visual-understanding
      - name: CAMPAIGN_STRATEGIST_MODEL_DEPLOYMENT_NAME
        value: campaign-reasoning
      - name: COPYWRITER_DEPLOYMENT_MODE
        value: ${COPYWRITER_DEPLOYMENT_MODE}
      - name: CAMPAIGN_COPYWRITER_MODEL_DEPLOYMENT_NAME
        value: adaptive-copy
      - name: CAMPAIGN_COPYWRITER_ROUTER_DEPLOYMENT_NAME
        value: adaptive-copy
      - name: MAI_IMAGE_MODEL_DEPLOYMENT_NAME
        value: creative-image
    protocols:
      - protocol: responses
        version: 1.0.0
