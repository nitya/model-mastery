name: product-launch-studio-optimization
agent:
  name: product-launch-studio
  kind: hosted
  version: "1"
  model: adaptive-copy
  config: .agent_configs/baseline/metadata.yaml
dataset:
  local_uri: ../../data/eval-cases.jsonl
evaluators:
  - relevance
  - task_adherence
  - intent_resolution
  - indirect_attack
  - name: campaign_quality
    version: "1"
    local_uri: ../../data/evaluators/campaign-quality.yaml
options:
  eval_model: campaign-reasoning
  optimization_model: campaign-reasoning
  max_candidates: 4
  optimization_config:
    model_search_space:
      - adaptive-copy
      - campaign-reasoning
