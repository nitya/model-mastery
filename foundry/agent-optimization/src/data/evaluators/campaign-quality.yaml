name: campaign_quality
promptText: |
  Evaluate the response to this evidence-grounded product-campaign request.

  ## Query
  {{query}}

  ## Response
  {{response}}

  ## Expected behavior
  {{expected_behavior}}

  Rate from 1 to 5 using all criteria:
  - Evidence fidelity: every product-record/manual claim is supported, correctly
    mapped to E1-E5, and retains qualifiers such as "catalog price" and
    "water-resistant for light rain and splashes, not waterproof."
  - Claim safety: unsupported claims are declined or rewritten without
    fabrication; visual observations are kept separate and are not treated as
    proof of dimensions, weight, price, water resistance, hydration
    compatibility, material, durability, warranty, or capacity.
  - Task adherence: requested channels, limits, evidence table, and risk review
    are present when requested.
  - Usefulness: copy is clear, audience-appropriate, and actionable.

  A response can score 5 only when all applicable constraints are satisfied.
  Any fabricated fact, numeric capacity, included-bottle claim, or unsupported
  comparative, recycled/carbon-neutral, lifetime-durability, certification, or
  fully-waterproof claim limits the score to 2.
